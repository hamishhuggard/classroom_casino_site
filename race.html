<!doctype html>
<html lang="en" data-theme="apple2">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revision Roulette — Class Race</title>
<!-- Projector page: a live "bar chart race" of the class, Apple II style. Reads the results backend (results-config.js)
     for a class code and re-polls every 5 s; bars grow and swap places as students answer.
     Use: race.html?code=KEA7   (add &day=2026-11-03 for another day, &demo=1 for fake data, &api=URL to override). -->
<link rel="stylesheet" href="apple2.css">
<style>
:root{--paper:#000;--ink:#fff;--muted:#14cffd;--a2-green:#14f53c;--a2-violet:#ff44fd;--a2-orange:#ff6a3c;--a2-blue:#14cffd;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;cursor:default}
body{display:flex;flex-direction:column;height:100svh;width:100vw;padding:clamp(12px,2.6vh,32px) clamp(16px,3vw,56px)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:4px double var(--a2-blue);padding-bottom:1.2vh;flex:0 0 auto}
h1{margin:0;font-size:clamp(34px,7vh,84px);line-height:1;letter-spacing:.04em;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(var(--a2-green) 0 25%,var(--a2-orange) 25% 50%,var(--a2-violet) 50% 75%,var(--a2-blue) 75%)}
.sub{color:var(--a2-blue);font-size:clamp(16px,3vh,32px);text-align:right;line-height:1.15}
.sub b{color:var(--a2-green)}
#class{font-size:clamp(30px,7vh,76px);line-height:1}
#chart{position:relative;flex:1 1 auto;margin:1.4vh 0;min-height:0}
.row{position:absolute;left:0;right:0;top:0;height:var(--row);display:flex;align-items:center;gap:1.4vw;
  transition:transform .9s steps(9,end),opacity .5s steps(4,end)}
.rank{flex:0 0 2.4em;text-align:right;color:var(--a2-blue);font-size:calc(var(--row)*.5)}
.who{flex:0 0 clamp(150px,22vw,420px);display:flex;align-items:center;gap:.8vw;min-width:0}
.who svg{flex:0 0 auto;height:calc(var(--row)*.78);width:auto;max-width:none}
.who span{font-size:calc(var(--row)*.46);white-space:nowrap;overflow:hidden;text-overflow:clip;line-height:1}
.lane{flex:1 1 auto;position:relative;height:calc(var(--row)*.74);min-width:0}
.bar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);transition:width .9s steps(9,end);
  /* scan-line stripes, like a hi-res Apple II fill */
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.38) 3px 4px)}
.val{position:absolute;top:50%;transform:translateY(-50%);left:0;padding-left:.6vw;white-space:nowrap;color:#fff;font-size:calc(var(--row)*.52);
  transition:left .9s steps(9,end)}
.row.leader .who span{color:var(--a2-green)}
.row.leader .rank{color:var(--a2-orange)}
.row.out{opacity:0}
@keyframes flash{0%,49%{opacity:1}50%,100%{opacity:.2}}
footer{flex:0 0 auto;display:flex;justify-content:space-between;color:var(--a2-blue);font-size:clamp(14px,2.6vh,26px);border-top:4px double var(--a2-blue);padding-top:1vh}
.blink{animation:flash 1.07s steps(1,end) infinite}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--a2-blue);font-size:clamp(22px,5vh,56px);line-height:1.4}
#empty.hidden{display:none}
#setup{position:fixed;inset:0;background:#000;display:grid;place-items:center;text-align:center;z-index:5}
#setup[hidden]{display:none}
#setup input{font:inherit;font-size:clamp(30px,8vh,80px);width:6em;text-align:center;text-transform:uppercase;background:#000;color:var(--a2-green);border:3px solid var(--a2-green);padding:8px}
#setup p{color:var(--a2-blue);font-size:clamp(18px,4vh,40px)}
@media(prefers-reduced-motion:reduce){.row,.bar,.val{transition:none}.blink}
</style>
</head>
<body>
<header><h1>CLASS RACE</h1><div class="sub"><div id="class">CLASS <b>----</b></div><div id="day"></div></div></header>
<main id="chart" aria-live="off"><div id="empty">WAITING FOR PLAYERS<br><span class="blink">GET READY TO ANSWER...</span></div></main>
<footer><span id="status">CONNECTING...</span></footer>
<section id="setup" hidden><form><h1 style="font-size:clamp(34px,9vh,90px)">CLASS CODE</h1><p>TYPE THE CODE, THEN PRESS ENTER</p><input id="code-in" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12"></form></section>
<script src="results-config.js"></script>
<script src="assets/animals/animals.js"></script>
<script>
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
const tidy=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const API=String(q.get('api')||window.CASINO_RESULTS_API||'').trim().replace(/\/+$/,'');
const DEMO=q.get('demo')==='1';
let code=tidy(q.get('code'));
try{if(code)localStorage.setItem('casino-class-code',code);else code=localStorage.getItem('casino-class-code')||'';}catch{}
const COLOURS=['#14f53c','#ff44fd','#ff6a3c','#14cffd'];
const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// "v1 2026-11-02 unit=id:attempts.correct.first,...;bank=120" -> the player's bank in dollars (0 if the game didn't send one)
function bankOf(payload){const m=String(payload).match(/;bank=(\d+)\s*$/);return m?Number(m[1]):0;}
let players=[];          // [{key,name,score}]
const rows=new Map();    // key -> {el,bar,val,shown,target}
let maxScale=50,lastDay='';
function layout(){
  const chart=$('chart'),h=chart.clientHeight;
  const n=Math.max(5,Math.min(players.length||5,Math.floor(h/46),14));
  return {n,row:Math.floor(h/n)};
}
function niceMax(v){const steps=[50,100,150,200,300,400,500,750,1000,1500,2000,3000,5000,10000];return steps.find(s=>s>=v*1.08)||Math.ceil(v*1.1);}
function render(){
  const {n,row}=layout(),chart=$('chart');
  chart.style.setProperty('--row',row+'px');
  $('empty').classList.toggle('hidden',players.length>0);
  const sorted=[...players].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
  const top=sorted.slice(0,n);
  const peak=top[0]?top[0].score:0;
  maxScale=Math.max(maxScale*0.999,niceMax(peak));   // the axis only grows, so bars never jump back
  const keep=new Set(top.map(p=>p.key));
  for(const [key,r] of rows)if(!keep.has(key)){r.el.classList.add('out');r.el.style.transform=`translateY(${n*row}px)`;setTimeout(()=>{if(!keep.has(key)&&rows.get(key)===r){r.el.remove();rows.delete(key);}},600);}
  top.forEach((p,i)=>{
    let r=rows.get(p.key);
    if(!r){
      const el=document.createElement('div');el.className='row';
      el.style.transform=`translateY(${n*row}px)`;
      const colour=COLOURS[hash(p.name)%COLOURS.length];
      el.innerHTML=`<div class="rank"></div><div class="who">${globalThis.animalIcon?animalIcon(p.name,3,true):''}<span>${esc(p.name.toUpperCase())}</span></div><div class="lane"><div class="bar" style="--c:${colour}"></div><div class="val">$0</div></div>`;
      chart.append(el);r={el,bar:el.querySelector('.bar'),val:el.querySelector('.val'),rank:el.querySelector('.rank'),shown:0,colour};rows.set(p.key,r);
      void el.offsetWidth;
    }
    r.el.classList.remove('out');r.el.classList.toggle('leader',i===0&&p.score>0);
    r.el.style.transform=`translateY(${i*row}px)`;
    r.rank.textContent=i+1;
    const pct=Math.min(100,100*p.score/maxScale);
    r.bar.style.width=pct+'%';
    r.val.style.left=`calc(${pct}% )`;
    // count up in hard steps to the new score
    const from=r.shown,to=p.score;r.target=to;
    if(from!==to){clearInterval(r.count);let k=0;const steps=9;r.count=setInterval(()=>{k++;r.shown=k>=steps?to:Math.round(from+(to-from)*k/steps);r.val.textContent='$'+r.shown;if(k>=steps)clearInterval(r.count);},100);}
  });
}
function setPlayers(list){players=list;render();}
async function poll(){
  try{
    const res=await fetch(`${API}/api/reports?code=${encodeURIComponent(code)}`,{cache:'no-store'});if(!res.ok)throw new Error(res.status);
    const reports=await res.json();
    const day=q.get('day')||reports.reduce((d,r)=>r.day>d?r.day:d,'');
    const seen={},list=[];
    for(const r of reports.filter(r=>r.day===day)){
      const base=r.name||r.id;seen[base]=(seen[base]||0)+1;
      list.push({key:r.id,name:seen[base]>1?`${base} ${seen[base]}`:base,score:bankOf(r.payload)});
    }
    lastDay=day;$('day').textContent=day;
    $('status').textContent=`LIVE · ${list.length} PLAYER${list.length===1?'':'S'} · ${new Date().toLocaleTimeString()}`;
    setPlayers(list);
  }catch(e){$('status').innerHTML=`<span class="blink">NO LINK TO SERVER (${esc(e.message)}) · RETRYING</span>`;}
}
function demo(){
  const names=['Grumpy Gorilla','Shrieking Seagull','Dizzy Dolphin','Lucky Llama','Mighty Meerkat','Sneaky Sloth','Plucky Penguin','Wobbly Walrus','Jolly Jellyfish','Quirky Quokka','Happy Hedgehog','Sleepy Otter','Bouncing Beaver','Cheeky Cheetah'];
  const list=names.map((name,i)=>({key:'P-'+i,name,score:0,pace:.3+Math.random()*.9}));
  $('class').innerHTML='CLASS <b>DEMO</b>';$('day').textContent=new Date().toLocaleDateString('en-CA');
  setInterval(()=>{for(const p of list)if(Math.random()<p.pace*.6)p.score+=Math.random()<.7?10:5;if(Math.random()<.03){p.score=Math.max(0,p.score+(Math.random()<.5?-1:2)*Math.floor(p.score/3));}
    $('status').textContent=`DEMO · FAKE DATA · ${list.length} PLAYERS`;setPlayers(list.map(p=>({...p})));},1100);
  setPlayers(list.map(p=>({...p})));
}
function start(){
  $('setup').hidden=true;$('class').innerHTML=`CLASS <b>${esc(code||'----')}</b>`;
  if(DEMO)return demo();
  if(!API){$('status').textContent='NO RESULTS SERVER SET (results-config.js)';return;}
  poll();setInterval(poll,5000);
}
addEventListener('resize',render);
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F'){if(e.target.tagName==='INPUT')return;document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();}});
if(!code&&!DEMO){
  $('setup').hidden=false;const input=$('code-in');input.focus();
  $('setup').querySelector('form').onsubmit=e=>{e.preventDefault();const v=tidy(input.value);if(v.length<2)return;code=v;try{localStorage.setItem('casino-class-code',code);}catch{}start();};
}else start();
</script>
</body>
</html>
